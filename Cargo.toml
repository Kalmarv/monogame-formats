[package]
name = "monogame-formats"
description = "Read MonoGame/XNA content: the XNB container and compiled MGFX effects, with checked reads that never panic on untrusted bytes"
keywords = ["monogame", "xna", "xnb", "mgfx", "gamedev"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/monogame-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
primase-testdata.workspace = true
sha2.workspace = true
serde_json.workspace = true

[dependencies]
primase-foundations.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/monogame-formats"
publish = true

[workspace.dependencies]
primase-foundations = { version = "0.3.6", features = ["compress"] }
primase-testdata = "0.1.13"
sha2 = { version = "=0.11.1", default-features = false }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
